      <stop offset=".38" stop-color="#1d1d1f" stop-opacity=".9" />
      <stop offset="1" stop-color="#090b10" stop-opacity=".86" />
    </linearGradient>
    <clipPath id="squircle">
      <rect x="24" y="24" width="464" height="464" rx="132" />
    </clipPath>
    <filter id="materialShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="4" dy="10" stdDeviation="11" flood-color="#263244" flood-opacity=".22" />
    </filter>
    <filter id="glyphShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="3" dy="7" stdDeviation="7" flood-color="#263244" flood-opacity=".24" />
    </filter>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="24" y="24" width="464" height="464" fill="url(#pearl)" />
    <rect x="24" y="24" width="464" height="464" fill="url(#softLight)" />
    <rect x="24" y="24" width="464" height="464" fill="url(#blueCaustic)" />
    <ellipse cx="426" cy="402" rx="188" ry="150" fill="#8796aa" opacity=".1" />
  </g>

