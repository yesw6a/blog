<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>兮兮的个人站</title>
  <defs>
    <linearGradient id="pearl" x1="72" y1="48" x2="444" y2="474" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbfdff" />
      <stop offset=".46" stop-color="#e9eef4" />
      <stop offset="1" stop-color="#cbd5e1" />
    </linearGradient>
    <radialGradient id="softLight" cx="0" cy="0" r="1" gradientTransform="translate(144 106) rotate(48) scale(390)">
      <stop stop-color="#fff" stop-opacity=".94" />
      <stop offset=".44" stop-color="#fff" stop-opacity=".22" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blueCaustic" cx="0" cy="0" r="1" gradientTransform="translate(106 420) rotate(-35) scale(330)">
      <stop stop-color="#2997ff" stop-opacity=".2" />
      <stop offset=".62" stop-color="#7bbcff" stop-opacity=".06" />
      <stop offset="1" stop-color="#7bbcff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="clearGlass" x1="126" y1="96" x2="408" y2="412" gradientUnits="userSpaceOnUse">
