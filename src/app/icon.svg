      <stop offset=".7" stop-color="#dbe7f3" stop-opacity=".42" />
      <stop offset="1" stop-color="#eef4fa" stop-opacity=".68" />
    </linearGradient>
    <linearGradient id="smokedGlass" x1="170" y1="168" x2="350" y2="378" gradientUnits="userSpaceOnUse">
